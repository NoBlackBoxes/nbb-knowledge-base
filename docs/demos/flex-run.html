<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flex Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --ink:#111118; --dim:#5b6072; --line:#d5d9e4; --panel:#f4f5f9; --yellow:#f9be46; --purple:#4c3e69; --teal:#19a898; }
  * { box-sizing:border-box; }
  body { margin:0; background:#ffffff; color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; min-height:100dvh; margin:0; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font:400 20px/1.3 "Press Start 2P", ui-monospace, monospace; margin:0 0 8px; }
  .sub { color:var(--dim); margin:0 0 12px; }
  canvas { display:block; width:min(calc(100vw - 24px), calc((100dvh - 70px) * 16 / 9)); height:auto; aspect-ratio:16 / 9; background:#ffffff; border:3px solid var(--ink); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
  button { font:inherit; font-weight:600; color:var(--ink); background:#ffffff; border:2px solid var(--ink); border-radius:0; padding:8px 14px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  button.primary { background:var(--yellow); }
</style>
</head>
<body>
<main>
  <h1>FLEX RUN</h1>

  <div id="input-bar" class="row" style="margin:0 0 12px;justify-content:center">
    <label for="input-mode">Input:</label>
    <select id="input-mode">
      <option value="keyboard">Keyboard</option>
      <option value="sensors">Arduino sensors</option>
      <option value="emg">Digilent EMG</option>
    </select>
    <button type="button" id="input-arduino">Connect Arduino</button>
    <button type="button" id="input-emg">Connect EMG</button>
    <span id="input-status" aria-live="polite">Keyboard ready</span>
    <span>Joystick: <a href="https://playsnake.org/#google_vignette" target="_blank" rel="noopener noreferrer">Play Snake</a></span>
  </div>

  <canvas id="game" width="960" height="540" tabindex="0"></canvas>


</main>

    tap = false;
    return held && !prevHeld;
  }

  // ---------- Sound ----------
  let ac = null;
  function beep(freq, dur, type, delay) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), v = ac.createGain(), t0 = ac.currentTime + (delay || 0);
      o.type = type || 'square'; o.frequency.value = freq;
      v.gain.setValueAtTime(0.06, t0);
      v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(v); v.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) { /* sound is optional */ }
  }

  // ---------- Game ----------
  function startGame() {
    state = 'playing'; elapsed = 0; dist = 0; bonus = 0; combo = 0; shownLevel = 1; banner = null;
    y = 0; vy = 0; onGround = true; jumpBuffer = 0; squash = 0; shake = 0;
    boxes = []; brains = []; floats = []; bits = []; nextGap = 500;
    beep(523, 0.08); beep(784, 0.12, 'square', 0.08);
  }

  const score = () => Math.floor(dist / 20) + bonus;

  function burst(x, y0, n, colors, power) {      // a spray of little squares
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, sp = (0.3 + Math.random()) * (power || 260);
      bits.push({ x, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: 0.5 + Math.random() * 0.5, s: 4 + Math.floor(Math.random() * 3) * 3, c: colors[i % colors.length] });
    }
  }

  function spawn(speed) {
    if (flyers && elapsed > 5 && Math.random() < 0.28) {            // a flying box: too low to walk under, so duck
      boxes.push({ x: W + 20, w: 46, fly: true, lo: 56, h: 104 });
      nextGap = speed * (1.25 + Math.random() * 0.8);
      return;
    }
    const tall = elapsed > 12 && Math.random() < 0.3;
    const wide = !tall && Math.random() < 0.25;
    boxes.push({ x: W + 20, w: tall ? 30 : (wide ? 72 : 36), h: tall ? 78 : 36 + Math.floor(Math.random() * 2) * 12 });
    nextGap = speed * (1.2 + Math.random() * 0.9);
    if (Math.random() < 0.5) brains.push({ x: W + 20 + nextGap / 2 + 30, h: 100 + Math.random() * 45 });
  }

  function update(dt) {
    time += dt;
    const pressed = readButton();
    squash = Math.max(0, squash - dt * 5); shake = Math.max(0, shake - dt * 2.5);
    floats.forEach(f => { f.t -= dt; f.y -= 50 * dt; });
    floats = floats.filter(f => f.t > 0);
    bits.forEach(b => { b.t -= dt; b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; });
    bits = bits.filter(b => b.t > 0);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

    if (state !== 'playing') {
      if (state === 'title') { dist += 60 * dt; stride += dt * 6; }
      if (pressed && !(state === 'over' && time - overAt < 1.2)) startGame();
      return;
    }

    elapsed += dt;
    const speed = Math.min(580, 300 + elapsed * 6);
    dist += speed * dt; stride += speed * dt / 26;
    if (combo && (comboT -= dt) <= 0) combo = 0;

    const down = keys.has('ArrowDown') || keys.has('KeyS');
    ducking = down && onGround;                  // down arrow: crouch on the ground, drop faster in the air
    if (pressed) jumpBuffer = 0.12;              // a press just before landing still counts
    if (jumpBuffer > 0 && onGround && !ducking) {
      vy = 620; onGround = false; holdT = 0; jumpBuffer = 0; squash = -0.6;
      burst(PX + PW / 2, GY, 5, [INK, '#c9cdd8'], 120); beep(440, 0.05); beep(660, 0.08, 'square', 0.05);
    }
    jumpBuffer -= dt;
    if (!onGround) {
      const gravity = down ? 4600 : (vy > 0 && holdT < 0.28) ? 900 : 2000;   // every jump gets the full-height ascent, even after a brief tap
      holdT += dt; vy -= gravity * dt; y += vy * dt;
      if (y <= 0) { y = 0; vy = 0; onGround = true; squash = 1; burst(PX + PW / 2, GY, 6, [INK, '#c9cdd8'], 140); }
    }

    nextGap -= speed * dt;
    if (nextGap <= 0) spawn(speed);
    boxes.forEach(b => { b.x -= speed * dt; });
    brains.forEach(b => { b.x -= speed * dt; });
    boxes = boxes.filter(b => b.x + b.w > -20);
    brains = brains.filter(b => b.x > -60 && !b.got);

    for (const b of brains) {
      if (Math.abs(b.x - (PX + PW / 2)) < 54 && Math.abs(b.h - (y + PH / 2)) < 50) {
        b.got = true; combo = Math.min(combo + 1, 5); comboT = 4;
        const pts = 10 * combo; bonus += pts;
        floats.push({ x: PX + PW + 6, y: GY - y - PH - 6, t: 0.9, text: '+' + pts });
        burst(b.x, GY - b.h, 14, [YELLOW, PURPLE, INK, TEAL]);
        beep(880, 0.06); beep(1175 + combo * 60, 0.12, 'square', 0.06);
      }
    }
    for (const b of boxes) {
      const headroom = b.fly ? y + (ducking ? DUCK_H : PH) > b.lo + 4 : true;   // a flying box only hits what reaches up to it
      if (PX + PW - 8 > b.x && PX + 8 < b.x + b.w && y < b.h - 6 && headroom) {
        state = 'over'; overAt = time; best = Math.max(best, score()); shake = 1;
        burst(PX + PW / 2, GY - y - PH / 2, 40, [YELLOW, INK, PURPLE, YELLOW], 420);
        beep(330, 0.12, 'sawtooth'); beep(220, 0.14, 'sawtooth', 0.12); beep(147, 0.3, 'sawtooth', 0.26);
        return;
      }
    }
    const lvl = Math.floor(score() / 250) + 1;
    if (lvl > shownLevel) { shownLevel = lvl; banner = { text: 'LEVEL ' + lvl, t: 1.6 }; beep(660, 0.08); beep(880, 0.08, 'square', 0.09); beep(1320, 0.16, 'square', 0.18); }
  }

  // ---------- Drawing ----------
  function text(str, x, y0, size, color, align) {
    g.font = `${size}px ${PIXEL}`; g.textAlign = align || 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = color; g.fillText(str, x, y0);
  }
  const wrapX = (x, span) => ((x % span) + span) % span;

  function drawWorld() {
    const accent = ACCENTS[(shownLevel - 1) % ACCENTS.length];
    g.lineWidth = 3;
    clouds.forEach(c => {                                               // clouds made of squares
      const x = wrapX(c.x - dist * 0.12, 1560) - 200;
      g.strokeStyle = '#d9dde7';
      g.strokeRect(x, c.y, 44, 44); g.strokeRect(x + 30, c.y - 20, 52, 52); g.strokeRect(x + 70, c.y + 6, 40, 40);
    });
    skyline.forEach((s, i) => {                                         // far-off towers of stacked squares
      const x = wrapX(s.x - dist * 0.3, 1540) - 120;
      for (let k = 0; k < s.n; k++) {
        const yy = GY - (k + 1) * s.s;
        if ((i + k) % 5 === 0) { g.globalAlpha = 0.35; g.fillStyle = accent; g.fillRect(x, yy, s.s, s.s); g.globalAlpha = 1; }
        g.strokeStyle = '#c9cdd8'; g.strokeRect(x, yy, s.s, s.s);
      }
    });
    const first = Math.floor(dist / TILE), off = dist % TILE;           // ground: outlined tiles, a few filled in
    for (let i = -1; i <= W / TILE + 1; i++) {
      const x = Math.round(i * TILE - off), h = hash(first + i);
      g.fillStyle = '#ffffff'; g.fillRect(x, GY, TILE, TILE);
      g.fillStyle = h % 6 === 0 ? INK : (h % 11 === 0 ? accent : '#ffffff'); g.fillRect(x, GY + TILE, TILE, TILE);
      g.strokeStyle = INK; g.strokeRect(x, GY, TILE, TILE); g.strokeRect(x, GY + TILE, TILE, TILE);
    }
    g.fillStyle = INK; g.fillRect(0, GY - 2, W, 4);
  }

  function drawRunner() {                        // a cat built from squares, in the gif colours
    const feet = GY - y;
    const sq = onGround ? squash : (vy > 0 ? -0.35 : 0.1);              // squash on landing, stretch going up
    const block = (x, y0, w, h, fill) => { g.fillStyle = fill || YELLOW; g.fillRect(x, y0, w, h); g.strokeRect(x, y0, w, h); };
    const step = Math.floor(stride) % 2;
    g.save(); g.translate(PX + PW / 2, feet); g.scale(1.2 * (1 + 0.16 * sq), 1.2 * (1 - 0.16 * sq));
    g.strokeStyle = INK; g.lineWidth = 2.5; g.fillStyle = INK;
    const gif = (x, y0, h) => { if (ready(wordmark)) g.drawImage(wordmark, x, y0, h * wordmark.naturalWidth / wordmark.naturalHeight, h); };
    if (ducking) {
      [-26, -12, 2, 14].forEach((x, i) => g.fillRect(x, -8, 7, (i + step) % 2 ? 8 : 4));     // short quick legs
      block(-46, -26, 16, 8);                                            // tail held flat
      block(-30, -28, 46, 20);                                           // body
      gif(-16, -27, 18);                                                 // the gif lettering on its side
      block(13, -40, 8, 8); block(29, -40, 8, 8);                        // ears
      block(10, -34, 30, 26);                                            // head, pushed forward and low
      g.fillStyle = INK; g.fillRect(27, -25, 5, 5); g.fillStyle = PURPLE; g.fillRect(36, -17, 4, 4);
    } else {
      if (onGround) [-24, -12, 0, 10].forEach((x, i) => g.fillRect(x, -10, 8, (i + step) % 2 ? 10 : 5));
      else [-24, -12, 0, 10].forEach(x => g.fillRect(x, -10, 8, 5));     // legs tucked in the air
      block(-38, -46, 10, 12); block(-38, -58, 10, 12);                  // tail
      block(-28, -40, 44, 30);                                           // body
      gif(-19, -39, 28);                                                 // the gif lettering on its side
      block(6, -72, 9, 9); block(23, -72, 9, 9);                         // ears
      block(4, -64, 30, 30);                                             // head
      g.fillStyle = INK; g.fillRect(21, -53, 5, 5); g.fillStyle = PURPLE; g.fillRect(30, -44, 4, 4);
    }
    g.restore();
  }

  function logosRow(cx, cy, k) {                 // gif badge  x  NBB brain, centred on (cx, cy)
    const b = 56 * k, nw = 86 * k, nh = ready(nbbBig) ? nw * nbbBig.naturalHeight / nbbBig.naturalWidth : nw * 0.82, gap = 46 * k;
    const x0 = cx - (b + gap + nw) / 2;
    if (ready(badge)) g.drawImage(badge, x0, cy - b / 2, b, b);
    g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(x0, cy - b / 2, b, b);
    text('x', x0 + b + gap / 2, cy + 7 * k, 14 * k, INK);
    if (ready(nbbBig)) g.drawImage(nbbBig, x0 + b + gap, cy - nh / 2, nw, nh);
  }

  function card(x, y0, w, h) {                   // white panel with a hard retro shadow
    g.fillStyle = INK; g.fillRect(x + 8, y0 + 8, w, h);
    g.fillStyle = '#ffffff'; g.fillRect(x, y0, w, h);
    g.strokeStyle = INK; g.lineWidth = 4; g.strokeRect(x, y0, w, h);
  }

  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    if (shake > 0) g.translate(Math.round((Math.random() - 0.5) * shake * 16), Math.round((Math.random() - 0.5) * shake * 16));
    drawWorld();

    for (const b of brains) {
      const by = Math.round(GY - b.h + Math.sin(time * 4 + b.h) * 4);
      if (ready(nbb)) g.drawImage(nbb, Math.round(b.x - nbb.naturalWidth / 2), by - Math.round(nbb.naturalHeight / 2));
      else { g.strokeStyle = INK; g.strokeRect(b.x - 20, by - 20, 40, 40); }
    }
    for (const b of boxes) {                                           // the black boxes
      const bx = Math.round(b.x), lo = b.fly ? b.lo : 0;
      g.fillStyle = INK; g.fillRect(bx, GY - b.h, b.w, b.h - lo);
      g.fillStyle = '#ffffff'; g.fillRect(bx + 6, GY - b.h + 6, 6, 6);
      if (b.fly) {                                                     // two little flapping wings
        const up = Math.floor(time * 10) % 2 ? 14 : 4;
        g.fillStyle = INK; g.fillRect(bx - 14, GY - b.h - up + 10, 16, 6); g.fillRect(bx + b.w - 2, GY - b.h - up + 10, 16, 6);
      }
    }
    if (state !== 'over') drawRunner();
    bits.forEach(b => { g.globalAlpha = clamp(b.t * 2.5, 0, 1); g.fillStyle = b.c; g.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s); });
    g.globalAlpha = 1;
    floats.forEach(f => { g.globalAlpha = clamp(f.t * 2, 0, 1); text(f.text, f.x, f.y, 16, PURPLE, 'left'); });
    g.globalAlpha = 1;
    g.setTransform(1, 0, 0, 1, 0, 0);

    // Heads-up display
    text('SCORE ' + String(state === 'title' ? 0 : score()).padStart(5, '0'), 22, 40, 18, INK, 'left');
    text('BEST ' + String(best).padStart(5, '0'), 22, 66, 11, DIM, 'left');
    if (combo > 1 && state === 'playing') text('COMBO x' + combo, 22, 96, 14, PURPLE, 'left');
    logosRow(W - 110, 46, 0.62);

    if (banner) { g.globalAlpha = clamp(banner.t * 2, 0, 1); text(banner.text, W / 2, 150, 40, INK); g.globalAlpha = 1; }

    const blink = Math.floor(time * 2.5) % 2 === 0;
    if (state === 'title') {
      text('FLEX RUN', W / 2 + 4, 174, 64, YELLOW); text('FLEX RUN', W / 2, 170, 64, INK);
      text('JUMP THE BLACK BOXES WITH YOUR MUSCLES', W / 2, 220, 14, DIM);
      if (blink) text('PRESS SPACE OR SENSOR TO START', W / 2, 280, 20, PURPLE);
    } else if (state === 'over') {
      const cw = 620, ch = 396, cx = (W - cw) / 2, cy = 40;
      card(cx, cy, cw, ch);
      logosRow(W / 2, cy + 68, 1.25);
      text('SCORE', W / 2, cy + 150, 16, DIM);
      text(String(score()), W / 2 + 4, cy + 218, 56, YELLOW); text(String(score()), W / 2, cy + 214, 56, INK);
      text(score() >= best && best > 0 ? 'NEW BEST!' : 'BEST ' + best, W / 2, cy + 250, 14, PURPLE);
      text('POWERED BY YOUR INPUT', W / 2, cy + 290, 13, INK);
      text('GIF LONDON 2026  x  NO BLACK BOXES', W / 2, cy + 316, 11, DIM);
      if (blink && time - overAt > 1.2) text('PRESS SPACE OR SENSOR TO PLAY AGAIN', W / 2, cy + 362, 15, PURPLE);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- Keyboard controls ----------
  window.addEventListener('keydown', event => {
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(event.code)) event.preventDefault();
    if (JUMP_KEYS.includes(event.code) && !event.repeat) tap = true;
    keys.add(event.code);
  });
  window.addEventListener('keyup', event => keys.delete(event.code));
  window.addEventListener('blur', () => keys.clear());

  requestAnimationFrame(frame);
})();
</script>
<script>
(() => {
  const clients = {
    sensors: 'arduino/sensors/client.js',
    emg: 'digilent/emg/client.js',
  };
  const select = document.getElementById('input-mode');
  const arduino = document.getElementById('input-arduino');
  const emg = document.getElementById('input-emg');
  const status = document.getElementById('input-status');
  const requested = new URLSearchParams(location.search).get('input');
  const mode = Object.hasOwn(clients, requested) ? requested : 'keyboard';
  select.value = mode;
  arduino.hidden = mode !== 'sensors';
  emg.hidden = mode !== 'emg';
  select.addEventListener('change', () => {
    const url = new URL(location.href);
    url.searchParams.set('input', select.value);
    location.href = url.href;
  });
  if (mode === 'keyboard') return;
  const button = mode === 'emg' ? emg : arduino;
  button.disabled = true;
  status.textContent = 'Loading controller…';
  const script = document.createElement('script');
  script.src = clients[mode];
  script.onload = () => { button.disabled = false; status.textContent = 'Ready to connect'; };
  script.onerror = () => { status.textContent = 'Controller failed to load'; };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
